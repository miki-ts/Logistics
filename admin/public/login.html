<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login · YM Logistics</title>
  <link rel="stylesheet" href="/public/admin.css">
</head>
<body class="login">
  <main class="login-card">
    <div class="mark has-logo">
      <img src="/public/assets/logo.png" alt="YM Logistics" class="login-logo">
    </div>
    <p class="eyebrow">YM LOGISTICS</p>
    <h1>Admin portal</h1>
    <p class="muted">Sign in to access the operations dashboard.</p>

    <form id="loginForm" novalidate>
      <label>
        Username
        <input name="username" autocomplete="username" required maxlength="64" placeholder="Enter your username">
      </label>
      <label>
        Password
        <div class="password-wrap">
          <input name="password" type="password" autocomplete="current-password" required maxlength="256" placeholder="Enter your password" id="pwInput">
            <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </label>
      <p id="error" class="error" role="alert"></p>
      <button type="submit" id="signInBtn">Sign in →</button>
    </form>
  </main>

  <style>
    .password-wrap {
      position: relative;
      margin-top: 7px;
    }
    .password-wrap input {
      margin-top: 0;
      padding-right: 44px;
      width: 100%;
    }
    .pw-toggle {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: color .15s;
    }
    .pw-toggle:hover { color: var(--ink); }
    .login-footer {
      text-align: center;
      font-size: 11px;
      color: #a0b0a5;
      margin-top: 28px;
      font-family: 'DM Mono', monospace;
      letter-spacing: .06em;
    }
  </style>

  <script>
    const pwInput  = document.getElementById('pwInput');
    const pwToggle = document.getElementById('pwToggle');
    const eyeIcon  = document.getElementById('eyeIcon');
    const EYE_OPEN = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    const EYE_OFF  = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;
    pwToggle.addEventListener('click', () => {
      const isHidden = pwInput.type === 'password';
      pwInput.type = isHidden ? 'text' : 'password';
      eyeIcon.innerHTML = isHidden ? EYE_OFF : EYE_OPEN;
    });
  </script>
  <script src="/public/login.js"></script>
</body>
</html>
